name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux phpunit backends
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        env:
          phpts: zts
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Check out Swow
        uses: actions/checkout@v7
        with:
          repository: swow/swow
          ref: 691a2ced3072a7e3cd983a6863e74dc76169391c
          path: third_party/swow

      - name: Check out Toy
        uses: actions/checkout@v7
        with:
          repository: dixyes-digital-wastes/ext-toy
          path: third_party/toy

      - name: Install extension build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential libssl-dev libcurl4-openssl-dev pkg-config

      - name: Build Swow
        run: |
          cd third_party/swow/ext
          phpize
          ./configure --enable-swow --disable-swow-curl --disable-swow-ssl --disable-swow-pdo-pgsql
          make -j"$(nproc)"
          echo "SWOW_EXT=$PWD/modules/swow.so" >> "$GITHUB_ENV"

      - name: Build Toy
        run: |
          cd third_party/toy
          phpize
          ./configure --enable-toy
          make -j"$(nproc)"
          echo "TOY_EXT=$PWD/modules/toy.so" >> "$GITHUB_ENV"

      - name: Show extensions
        run: |
          php -v
          php -d extension="$SWOW_EXT" -r 'exit(extension_loaded("swow") ? 0 : 1);'
          php -d extension="$SWOW_EXT" -d extension="$TOY_EXT" -r 'exit(extension_loaded("toy") ? 0 : 1);'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run native tests
        run: vendor/bin/phpunit --testsuite gem

      - name: Run Swow tests
        env:
          GEM_EXPECT_SWOW: 'true'
        run: php -d extension="$SWOW_EXT" vendor/bin/phpunit --testsuite gem

      - name: Run Swow and Toy tests
        env:
          GEM_EXPECT_SWOW: 'true'
          GEM_EXPECT_TOY: 'true'
        run: php -d extension="$SWOW_EXT" -d extension="$TOY_EXT" vendor/bin/phpunit --testsuite gem

  macos:
    name: macOS phpunit backends
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        env:
          phpts: zts
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Check out Swow
        uses: actions/checkout@v7
        with:
          repository: swow/swow
          ref: 691a2ced3072a7e3cd983a6863e74dc76169391c
          path: third_party/swow

      - name: Check out Toy
        uses: actions/checkout@v7
        with:
          repository: dixyes-digital-wastes/ext-toy
          path: third_party/toy

      - name: Install extension build dependencies
        run: brew install autoconf automake pkg-config openssl@3

      # swow_socket.c includes openssl/evp.h unconditionally, while
      # --disable-swow-ssl keeps its own OpenSSL detection off, so the header
      # path has to come from the environment
      - name: Build Swow
        run: |
          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          export CPATH="${OPENSSL_PREFIX}/include"
          export CPPFLAGS="-I${OPENSSL_PREFIX}/include"
          export LDFLAGS="-L${OPENSSL_PREFIX}/lib"
          cd third_party/swow/ext
          phpize
          ./configure --enable-swow --disable-swow-curl --disable-swow-ssl --disable-swow-pdo-pgsql
          make -j"$(sysctl -n hw.ncpu)"
          echo "SWOW_EXT=$PWD/modules/swow.so" >> "$GITHUB_ENV"

      - name: Build Toy
        run: |
          cd third_party/toy
          phpize
          ./configure --enable-toy
          make -j"$(sysctl -n hw.ncpu)"
          echo "TOY_EXT=$PWD/modules/toy.so" >> "$GITHUB_ENV"

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run native tests
        run: vendor/bin/phpunit --testsuite gem

      - name: Run Swow tests
        env:
          GEM_EXPECT_SWOW: 'true'
        run: php -d extension="$SWOW_EXT" vendor/bin/phpunit --testsuite gem

      - name: Run Swow and Toy tests
        env:
          GEM_EXPECT_SWOW: 'true'
          GEM_EXPECT_TOY: 'true'
        run: php -d extension="$SWOW_EXT" -d extension="$TOY_EXT" vendor/bin/phpunit --testsuite gem

  windows:
    name: Windows phpunit backends
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        env:
          phpts: zts
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Check out PHP source
        uses: actions/checkout@v7
        with:
          repository: php/php-src
          ref: PHP-8.5
          path: build/php-src

      - name: Check out Swow
        uses: actions/checkout@v7
        with:
          repository: swow/swow
          ref: 691a2ced3072a7e3cd983a6863e74dc76169391c
          path: build/swow

      - name: Check out Toy
        uses: actions/checkout@v7
        with:
          repository: dixyes-digital-wastes/ext-toy
          path: build/php-src/ext/toy

      - name: Check out the PHP build tools
        uses: actions/checkout@v7
        with:
          repository: php/php-sdk-binary-tools
          ref: master
          path: php-sdk-binary-tools

      # The swow repository keeps the extension in its own ext/ directory, while
      # an in-tree PHP build only reads ext/<name>/config.w32
      - name: Stage Swow extension
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "build/php-src/ext/swow" | Out-Null
          Copy-Item -Recurse -Force "build/swow/ext/*" "build/php-src/ext/swow"

      # swow_socket.c includes openssl/evp.h unconditionally, while
      # --disable-swow-ssl keeps its own OpenSSL detection off, so the header
      # path has to come from the environment
      - name: Locate OpenSSL headers
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\OpenSSL-Win64\include",
            "$env:ProgramFiles\OpenSSL\include",
            "${env:ProgramFiles(x86)}\OpenSSL-Win32\include",
            "C:\OpenSSL-Win64\include",
            "C:\vcpkg\installed\x64-windows\include"
          )
          $candidates += Get-ChildItem -Path "$env:ProgramFiles", "C:\" -Directory -Filter "OpenSSL*" -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName "include" }
          $include = $candidates |
            Where-Object { Test-Path -LiteralPath (Join-Path $_ "openssl\evp.h") } |
            Select-Object -First 1
          if (-not $include) {
            Write-Host "OpenSSL headers not found; tried:"
            $candidates | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          if ($env:INCLUDE) {
            "INCLUDE=$include;$env:INCLUDE" >> $env:GITHUB_ENV
          } else {
            "INCLUDE=$include" >> $env:GITHUB_ENV
          }

      # PHP refuses an extension linked with a newer MSVC than the core, and
      # setup-php builds its core with 14.44, so the build has to use that
      # toolset instead of the image default
      - name: Resolve MSVC toolset
        shell: pwsh
        run: |
          $patterns = @(
            "$env:ProgramFiles\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*"
          )
          $toolsets = $patterns |
            ForEach-Object { Get-ChildItem $_ -Directory -ErrorAction SilentlyContinue } |
            Sort-Object Name
          Write-Host "Toolsets: $($toolsets.Name -join ', ')"
          $toolset = $toolsets | Where-Object { $_.Name -match '^14\.4\d*\.' } | Select-Object -Last 1
          if (-not $toolset) {
            Write-Host "No 14.4x MSVC toolset found"
            exit 1
          }
          Write-Host "Using MSVC toolset $($toolset.Name)"
          "MSVC_TOOLSET=$($toolset.Name)" >> $env:GITHUB_ENV

      - name: Build extensions
        shell: cmd
        working-directory: build/php-src
        run: |
          call "%GITHUB_WORKSPACE%\php-sdk-binary-tools\phpsdk-starter.bat" -c vs18 -a x64 -s %MSVC_TOOLSET% -t %GITHUB_WORKSPACE%\windows-ext-build.bat
          if errorlevel 1 exit /b 1
          if not exist x64\Release_TS\php_swow.dll (
            echo Missing php_swow.dll
            exit /b 1
          )
          if not exist x64\Release_TS\php_toy.dll (
            echo Missing php_toy.dll
            exit /b 1
          )

      - name: Set extension paths
        shell: pwsh
        run: |
          "SWOW_EXT=$PWD\build\php-src\x64\Release_TS\php_swow.dll" >> $env:GITHUB_ENV
          "TOY_EXT=$PWD\build\php-src\x64\Release_TS\php_toy.dll" >> $env:GITHUB_ENV

      - name: Check extension binaries
        shell: pwsh
        run: |
          foreach ($name in "SWOW_EXT", "TOY_EXT") {
            $path = [Environment]::GetEnvironmentVariable($name)
            if (-not $path -or -not (Test-Path -LiteralPath $path)) {
              Write-Host "Missing extension binary: ${name}=$path"
              exit 1
            }
            Get-Item -LiteralPath $path | Select-Object FullName
          }

      - name: Show extensions
        shell: pwsh
        run: |
          php -v
          php -d extension=$env:SWOW_EXT -r 'exit(extension_loaded("swow") ? 0 : 1);'
          php -d extension=$env:SWOW_EXT -d extension=$env:TOY_EXT -r 'exit(extension_loaded("toy") ? 0 : 1);'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run native tests
        shell: pwsh
        run: php vendor/bin/phpunit --testsuite gem

      - name: Run Swow tests
        shell: pwsh
        env:
          GEM_EXPECT_SWOW: 'true'
        run: php -d extension=$env:SWOW_EXT vendor/bin/phpunit --testsuite gem

      - name: Run Swow and Toy tests
        shell: pwsh
        env:
          GEM_EXPECT_SWOW: 'true'
          GEM_EXPECT_TOY: 'true'
        run: php -d extension=$env:SWOW_EXT -d extension=$env:TOY_EXT vendor/bin/phpunit --testsuite gem
